[package]
name = "create-horizon-core"
version = "0.9.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental Create foundation: kinetics, pressing and item interactions"

[lib]
path = "src/lib.rs"

[dependencies]
create-horizon-adapter = { path = "crates/create-horizon-adapter" }
create-schematics = { path = "mixins/create/schematics" }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "factory"
path = "examples/factory.rs"

[workspace]
members = ["crates/create-core", "crates/create-mechanics", "crates/create-contraptions", "crates/create-horizon-adapter", "crates/create-testkit", "mixins/create/assets", "mixins/create/schematics"]
exclude = ["mixins/create/engine", ".local", ".tools"]

[lints.rust]
unsafe_code = "forbid"
