[mod]
id = "create"
version = "0.3.0"

[compatibility]
horizon_revision = "fc02103818c212920fd24aa34a2b2f91ba49e56f"

[[crate]]
id = "engine"
path = "engine"

[[crate]]
id = "assets"
path = "assets"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port"
source = "runtime.rs"

[[injection]]
id = "bundled-content"
target = "horizon_client::game::mods::content_root"
kind = "HEAD"
helper = "content_paths.rs"
bindings = [
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
]

[[injection]]
id = "local-assets"
target = "horizon_client::game::load_resources"
kind = "HEAD"
helper = "assets_startup.rs"
bindings = [{ name = "root", ty = "&mut std::path::PathBuf", value = "&mut root" }]

[[injection]]
id = "local-assets-reload"
target = "horizon_client::game::packs::stage_pack"
kind = "MODIFY_VARIABLE"
variable = { name = "root", ordinal = 1, at = "STORE" }
require = 1
ordinal = 0
helper = "assets_root.rs"
bindings = [
  { name = "root", ty = "std::path::PathBuf", value = "$value" },
]

[[injection]]
id = "entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<crate::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "models"
hook = "standalone_models"
hook_version = 1
kind = "HEAD"
helper = "models.rs"
bindings = [{ name = "models", ty = "&mut Vec<String>", value = "&mut *models" }]

[[injection]]
id = "draw"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "use-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_on.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
]

[[injection]]
id = "placed"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# API 359 has a server right-click hook but no block client-result hook.
# Pin this one prediction boundary; do not duplicate inventory logic on clients.
[[injection]]
id = "depot-prediction"
target = "horizon_client::game::remote::Game<'_>::remote_block_reacts"
kind = "HEAD"
cancellable = true
helper = "depot_prediction.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "hit", ty = "&crate::game::Hit", value = "hit" },
]

[[module]]
id = "inventory"
file = "crates/horizon-client/src/game.rs"
name = "create_port_inventory"
source = "inventory.rs"

[[module]]
id = "kinetic_runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_kinetic_runtime"
source = "kinetic_runtime.rs"

[[module]]
id = "sounds"
file = "crates/horizon-client/src/game.rs"
name = "create_port_sounds"
source = "sounds.rs"

[[module]]
id = "interactions"
file = "crates/horizon-client/src/game.rs"
name = "create_port_interactions"
source = "interactions.rs"

[[module]]
id = "motor-control"
file = "crates/horizon-client/src/game.rs"
name = "create_port_motor_control"
source = "motor_control.rs"

[[injection]]
id = "motor-open"
hook = "interaction_key"
hook_version = 1
kind = "HEAD"
helper = "motor_open.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "hand", ty = "horizon_client::first_person::Hand", value = "hand" },
  { name = "swing", ty = "&mut bool", value = "&mut *swing_hand" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "motor-wheel"
hook = "wheel"
hook_version = 1
kind = "HEAD"
helper = "motor_wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "motor-frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "motor_frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "motor-packet"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "motor_packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "motor-level"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "motor_level.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "motor-draw"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "motor_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "motor-click"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "motor_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "motor-drag"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "motor_drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "motor-hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "motor_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# The named container declaration has no dynamic insertion predicate at API 359.
# Preserve DepotItemHandler's no-merging rule at the inventory query boundary.
[[injection]]
id = "depot-automation-insert"
target = "horizon_client::game::machines::Containers<'_>::can_place"
kind = "HEAD"
cancellable = true
helper = "depot_automation.rs"
bindings = [
  { name = "containers", ty = "&crate::game::machines::Containers<'_>", value = "&*self" },
  { name = "view", ty = "&crate::game::machines::View", value = "view" },
  { name = "slot", ty = "usize", value = "slot" },
]

[[module]]
id = "world-items"
file = "crates/horizon-client/src/game.rs"
name = "create_port_world_items"
source = "world_items.rs"
