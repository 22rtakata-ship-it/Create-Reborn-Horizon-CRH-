[mod]
id = "create"
version = "0.2.0"

[compatibility]
horizon_revision = "fc02103818c212920fd24aa34a2b2f91ba49e56f"

[[crate]]
id = "engine"
path = "engine"

[[crate]]
id = "assets"
path = "assets"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port"
source = "runtime.rs"

[[injection]]
id = "bundled-content"
target = "horizon_client::game::mods::content_root"
kind = "HEAD"
helper = "content_paths.rs"
bindings = [
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
]

[[injection]]
id = "local-assets"
target = "horizon_client::game::load_resources"
kind = "HEAD"
helper = "assets_startup.rs"
bindings = [{ name = "root", ty = "&mut std::path::PathBuf", value = "&mut root" }]

[[injection]]
id = "local-assets-reload"
target = "horizon_client::game::packs::stage_pack"
kind = "MODIFY_VARIABLE"
variable = { name = "root", ordinal = 1, at = "STORE" }
require = 1
ordinal = 0
helper = "assets_root.rs"
bindings = [
  { name = "root", ty = "std::path::PathBuf", value = "$value" },
]

[[injection]]
id = "entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<crate::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "models"
hook = "standalone_models"
hook_version = 1
kind = "HEAD"
helper = "models.rs"
bindings = [{ name = "models", ty = "&mut Vec<String>", value = "&mut *models" }]

[[injection]]
id = "draw"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "use-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_on.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
]

[[injection]]
id = "placed"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# API 359 has a server right-click hook but no block client-result hook.
# Pin this one prediction boundary; do not duplicate inventory logic on clients.
[[injection]]
id = "depot-prediction"
target = "horizon_client::game::remote::Game<'_>::remote_block_reacts"
kind = "HEAD"
cancellable = true
helper = "depot_prediction.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "hit", ty = "&crate::game::Hit", value = "hit" },
]
